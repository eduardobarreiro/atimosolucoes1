<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página de acompanhamento de solicitações para a Átimo Soluções Integradas."
    />
    <title>Acompanhar solicitação</title>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/forms.css" />
  </head>
  <body data-page="tracking">
    <header class="site-header">
      <div class="container nav-shell">
        <a href="./index.html" class="brand" aria-label="Voltar para a página inicial">
          <img
            class="brand-logo"
            src="./atimo logo.png"
            alt="Logo Átimo Soluções Integradas"
          />
        </a>

        <nav class="main-nav" aria-label="Navegação de acompanhamento">
          <a href="./index.html">Início</a>
          <a href="./solicitacao.html">Solicitação</a>
          <a href="./admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="form-section">
        <div class="container tracking-layout">
          <div class="page-intro">
            <span class="eyebrow">Acompanhamento</span>
            <h1>Consulte o status da sua solicitação</h1>
            <p>
              Consulte o status da sua solicitação informando o código gerado no momento do envio.
            </p>
          </div>

          <form id="tracking-form" class="card form-card" novalidate>
            <div class="field-group">
              <label for="tracking-code">Código de solicitação</label>
              <input id="tracking-code" name="tracking-code" type="text" placeholder="Ex: ATS-00123" required />
            </div>

            <div class="form-footer">
              <p id="tracking-status" class="form-status" aria-live="polite"></p>
              <button type="submit" class="button button-primary">Consultar</button>
            </div>
          </form>

          <div id="tracking-result" class="tracking-result" hidden></div>
        </div>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
