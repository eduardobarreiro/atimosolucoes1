<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Formulário de solicitação de análise documental e orçamento para a Átimo Soluções Integradas."
    />
    <title>Solicitação de análise documental</title>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/forms.css" />
  </head>
  <body data-page="solicitacao">
    <header class="site-header">
      <div class="container nav-shell">
        <a href="./index.html" class="brand" aria-label="Voltar para a página inicial">
          <img
            class="brand-logo"
            src="./atimo logo.png"
            alt="Logo Átimo Soluções Integradas"
          />
        </a>

        <nav class="main-nav" aria-label="Navegação da página de solicitação">
          <a href="./index.html">Início</a>
          <a href="./acompanhar.html">Acompanhar</a>
          <a href="./admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="form-section">
        <div class="container form-layout">
          <div class="page-intro">
            <span class="eyebrow">Solicitação</span>
            <h1>Solicite análise documental e orçamento</h1>
            <p>
              Preencha os dados abaixo para enviar sua solicitação de análise documental. Os dados ficam
              armazenados localmente no navegador para esta etapa do projeto.
            </p>
          </div>

          <form id="solicitacao-form" class="card form-card" novalidate>
            <div class="form-grid two-columns">
              <div class="field-group">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" autocomplete="name" required />
              </div>

              <div class="field-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required />
              </div>

              <div class="field-group">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" autocomplete="tel" required />
              </div>

              <div class="field-group">
                <label for="placa">Placa</label>
                <input id="placa" name="placa" type="text" maxlength="8" placeholder="Ex: ABC1D23" required />
              </div>

              <div class="field-group full-row">
                <label for="mensagem">Detalhes da solicitação</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Descreva a situação documental e o que precisa ser regularizado." required></textarea>
              </div>
            </div>

            <div class="form-footer">
              <p id="form-status" class="form-status" aria-live="polite"></p>
              <button type="submit" class="button button-primary">Enviar para análise</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
